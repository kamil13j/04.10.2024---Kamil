<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Konwersja temperatury</title>
</head>
<body>
    <h1>Konwersja temperatury</h1>
    <p id="tempResult"></p>

    <script>
        function convertCelsiusToFahrenheit(celsius) {
            return (celsius * 9/5) + 32;
        }

        function displayTemperatureConversion() {
            let celsius = parseFloat(prompt("Podaj temperaturę w stopniach Celsjusza:"));

            if (isNaN(celsius)) {
                alert("Niepoprawna wartość! Podaj liczbę.");
                return;
            }

            const fahrenheit = convertCelsiusToFahrenheit(celsius);
            document.getElementById("tempResult").textContent = `${celsius}°C to ${fahrenheit.toFixed(2)}°F`;
        }

        displayTemperatureConversion();
    </script>
</body>
</html>
