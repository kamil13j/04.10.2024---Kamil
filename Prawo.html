<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Sprawdzanie uprawnień do prowadzenia pojazdu</title>
</head>
<body>
    <h1>Sprawdzanie uprawnień do prowadzenia pojazdu</h1>
    <p id="eligibilityResult"></p>

    <script>
        function checkDrivingEligibility(age) {
            return age >= 18 ? "Możesz prowadzić pojazd." : "Nie możesz jeszcze prowadzić pojazdu.";
        }

        function displayEligibility() {
            let age = parseInt(prompt("Podaj swój wiek:"));

            if (isNaN(age) || age < 0) {
                alert("Niepoprawna wartość! Wprowadź poprawny wiek.");
                return;
            }

            document.getElementById("eligibilityResult").textContent = "Wiek: " + age + " - " + checkDrivingEligibility(age);
        }

        displayEligibility();
    </script>
</body>
</html>
