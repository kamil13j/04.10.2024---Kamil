<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Obliczanie pola koła</title>
</head>
<body>
    <h1>Obliczanie pola koła</h1>
    <p id="circleResult"></p>

    <script>
        function calculateCircleArea(radius) {
            return Math.PI * Math.pow(radius, 2);
        }

        function displayCircleArea() {
            let radius = parseFloat(prompt("Podaj promień koła:"));

            if (isNaN(radius) || radius <= 0) {
                alert("Niepoprawna wartość! Podaj poprawny promień.");
                return;
            }

            const area = calculateCircleArea(radius);
            document.getElementById("circleResult").textContent = `Pole koła o promieniu ${radius} wynosi: ${area.toFixed(2)} cm²`;
        }

        displayCircleArea();
    </script>
</body>
</html>
