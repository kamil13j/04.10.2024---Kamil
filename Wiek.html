<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Generowanie losowego wieku</title>
</head>
<body>
    <h1>Generowanie losowego wieku</h1>
    <p id="ageResult"></p>

    <script>
        function generateRandomAge(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        function displayRandomAge() {
            let min = parseInt(prompt("Podaj minimalny wiek:"));
            let max = parseInt(prompt("Podaj maksymalny wiek:"));

            if (isNaN(min) || isNaN(max) || min >= max) {
                alert("Niepoprawne wartości! Wprowadź poprawny zakres.");
                return;
            }

            const age = generateRandomAge(min, max);
            document.getElementById("ageResult").textContent = "Wylosowany wiek: " + age;
        }

        displayRandomAge();
    </script>
</body>
</html>
